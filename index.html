
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selector de ubicación</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body, #mapa {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Vista inicial: Monterrey
        const mapa = L.map('mapa').setView(
            [25.6866, -100.3161], 15);

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }
        ).addTo(mapa);

        let marcador = null;
        //Corregir tamaño del mapa
        // Recalcular el tamaño del mapa cuando termina de mostrarse
        setTimeout(() => {
            mapa.invalidateSize(true);
        }, 500);

        // Volver a calcularlo si cambia el tamaño del contenedor
        window.addEventListener('resize', () => {
            mapa.invalidateSize(true);
        });

        // Seleccionar un punto haciendo clic
        mapa.on('click', function(evento) {
            const latitud = evento.latlng.lat;
            const longitud = evento.latlng.lng;

            if (marcador !== null) {
                marcador.setLatLng(evento.latlng);
            } else {
                marcador = L.marker(evento.latlng).addTo(mapa);
            }

            marcador.bindPopup(
                'Latitud: ' + latitud.toFixed(6) +
                '<br>Longitud: ' + longitud.toFixed(6)
            ).openPopup();

            // Más adelante conectaremos estos valores con Java.
        });
    </script>
</body>
</html>

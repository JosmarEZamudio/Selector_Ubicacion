```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selector de ubicación</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #mapa {
            position: absolute;
            inset: 0;
            background: #e5e5e5;
        }

        #btnUbicacion {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="mapa"></div>

    <button id="btnUbicacion" onclick="obtenerUbicacion()">
        Usar mi ubicación actual
    </button>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <script>
        // Vista inicial: Monterrey
        const mapa = L.map('mapa', {
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView([25.6866, -100.3161], 15);

        // Contadores para diagnosticar la carga de mosaicos
        let mosaicosCargados = 0;
        let mosaicosFallidos = 0;

        // Marcador seleccionado
        let marcador = null;

        // Capa de OpenStreetMap
        const capaMapa = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                updateWhenZooming: true,
                keepBuffer: 2,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    'OpenStreetMap</a> contributors',
                referrerPolicy: 'strict-origin-when-cross-origin'
            }
        ).addTo(mapa);

        // Mostrar diagnóstico en el título de la página
        function actualizarDiagnostico() {
            document.title =
                'Cargados: ' + mosaicosCargados +
                ' | Fallidos: ' + mosaicosFallidos;
        }

        // Registrar mosaicos cargados correctamente
        capaMapa.on('tileload', function() {
            mosaicosCargados++;
            actualizarDiagnostico();
        });

        // Registrar errores de carga
        capaMapa.on('tileerror', function(evento) {
            mosaicosFallidos++;

            console.error(
                'Error cargando mosaico:',
                evento.tile.src
            );

            actualizarDiagnostico();
        });

        // Recalcular el tamaño al terminar la carga inicial
        capaMapa.once('load', function() {
            setTimeout(() => {
                mapa.invalidateSize(true);
            }, 1000);
        });

        // Recalcular el tamaño inicial
        setTimeout(() => {
            mapa.invalidateSize(true);
        }, 500);

        // Recalcular cuando cambie el tamaño de la ventana
        window.addEventListener('resize', () => {
            mapa.invalidateSize(true);
        });

        // Seleccionar ubicación haciendo clic en el mapa
        mapa.on('click', function(evento) {
            const latitud = evento.latlng.lat;
            const longitud = evento.latlng.lng;

            if (marcador !== null) {
                marcador.setLatLng(evento.latlng);
            } else {
                marcador = L.marker(evento.latlng).addTo(mapa);
            }

            marcador.bindPopup(
                'Latitud: ' + latitud.toFixed(6) +
                '<br>Longitud: ' + longitud.toFixed(6)
            ).openPopup();

            // Más adelante conectaremos estos valores con Java.
        });

        // Obtener la ubicación actual del dispositivo
        function obtenerUbicacion() {
            alert("Geolocation: " + !!navigator.geolocation);
            alert("Secure context: " + window.isSecureContext);
                        
            if (!navigator.geolocation) {
                alert(
                    'La geolocalización no está disponible en este navegador.'
                );
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(posicion) {
                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;

                    // Centrar el mapa en la ubicación obtenida
                    mapa.setView([lat, lon], 16);

                    // Crear o actualizar el marcador existente
                    if (marcador !== null) {
                        marcador.setLatLng([lat, lon]);
                    } else {
                        marcador = L.marker([lat, lon]).addTo(mapa);
                    }

                    // Mostrar coordenadas
                    marcador.bindPopup(
                        'Mi ubicación actual<br>' +
                        'Latitud: ' + lat.toFixed(6) +
                        '<br>Longitud: ' + lon.toFixed(6)
                    ).openPopup();

                    // Recalcular el tamaño después de centrar
                    setTimeout(() => {
                        mapa.invalidateSize(true);
                    }, 500);
                },

                function(error) {
                    let mensaje;

                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            mensaje = 'Se denegó el permiso de ubicación.';
                            break;

                        case error.POSITION_UNAVAILABLE:
                            mensaje = 'No se pudo determinar la ubicación.';
                            break;

                        case error.TIMEOUT:
                            mensaje = 'Se agotó el tiempo para obtener la ubicación.';
                            break;

                        default:
                            mensaje = 'Ocurrió un error al obtener la ubicación.';
                    }

                    alert(mensaje);
                    console.error('Error de geolocalización:', error);
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
    </script>

</body>
</html>
```

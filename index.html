
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selector de ubicación</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body, #mapa {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Vista inicial: Monterrey
       const mapa = L.map('mapa', {
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView([25.6866, -100.3161], 15);

        // Contadores para diagnosticar la carga de los mosaicos
        let mosaicosCargados = 0;
        let mosaicosFallidos = 0;

        // Capa de OpenStreetMap
        const capaMapa = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                updateWhenZooming: false,
                keepBuffer: 4,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    'OpenStreetMap</a> contributors',
                referrerPolicy: 'strict-origin-when-cross-origin'
            }
        ).addTo(mapa);

        capaMapa.on('tileload', function(evento) {
            evento.tile.style.transform = 'translateZ(0)';
        });

        // Mostrar el diagnóstico en el título de la página
        function actualizarDiagnostico() {
            document.title =
                'Cargados: ' + mosaicosCargados +
                ' | Fallidos: ' + mosaicosFallidos;
        }

        // Registrar mosaicos cargados correctamente
        capaMapa.on('tileload', function() {
            mosaicosCargados++;
            actualizarDiagnostico();
        });

        // Registrar errores de carga
        capaMapa.on('tileerror', function(evento) {
            mosaicosFallidos++;

            console.error(
                'Error cargando mosaico:',
                evento.tile.src
            );

            actualizarDiagnostico();
        });

        // Recalcular el mapa cuando termina de cargar la capa inicial
        capaMapa.once('load', function() {
            setTimeout(() => {
                mapa.invalidateSize(true);
            }, 1000);
        });
        // Marcador seleccionado
        let marcador = null;

        // Recalcular el tamaño inicial del mapa
        setTimeout(() => {
            mapa.invalidateSize(true);
        }, 500);

        // Recalcular cuando cambie el tamaño del navegador
        window.addEventListener('resize', () => {
            mapa.invalidateSize(true);
        });

        // Seleccionar una ubicación haciendo clic
        mapa.on('click', function(evento) {
            const latitud = evento.latlng.lat;
            const longitud = evento.latlng.lng;

            if (marcador !== null) {
                marcador.setLatLng(evento.latlng);
            } else {
                marcador = L.marker(evento.latlng).addTo(mapa);
            }

            marcador.bindPopup(
                'Latitud: ' + latitud.toFixed(6) +
                '<br>Longitud: ' + longitud.toFixed(6)
            ).openPopup();

            // Más adelante conectaremos estos valores con Java.
        });
    </script>
</body>
</html>
